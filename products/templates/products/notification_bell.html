<style>

.notification-wrapper {
    position: relative;
    display: inline-flex;
    align-items: center;
}

.notification-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    text-decoration: none;
    color: inherit;
    transition: 0.2s ease;
}

.notification-link:hover {
    background: rgba(127, 127, 127, 0.12);
}

.notification-icon {
    font-size: 22px;
}

.notification-badge {
    position: absolute;
    top: -3px;
    right: -3px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 50px;
    background: #ef4444;
    color: white;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
}

</style>


<div class="notification-wrapper">

    <a href="{% url 'notifications' %}"
       class="notification-link"
       title="Notifications">

        <span class="notification-icon">
            🔔
        </span>

        {% if unread_notifications > 0 %}

            <span class="notification-badge">

                {% if unread_notifications > 99 %}
                    99+
                {% else %}
                    {{ unread_notifications }}
                {% endif %}

            </span>

        {% endif %}

    </a>

</div>
