<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Successful - MarketHub</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 100px auto;
        }

        .card {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .success {
            font-size: 60px;
        }

        h1 {
            margin-bottom: 15px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">

        <div class="success">
            ✓
        </div>

        <h1>
            Order Placed Successfully!
        </h1>

        <p>
            Thank you for shopping with MarketHub.
        </p>

        <p>
            Your order number is:
            <strong>#{{ order.id }}</strong>
        </p>

        <p>
            Total:
            <strong>₦{{ order.total_amount }}</strong>
        </p>

        <a
            href="/"
            class="button"
        >
            Continue Shopping
        </a>

    </div>

</div>


</body>

</html>
