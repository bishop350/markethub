<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout - MarketHub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 7%;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            width: 86%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        @media (max-width: 800px) {

            .checkout-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        MarketHub
    </div>

</header>


<div class="container">

    <h1>
        Checkout
    </h1>


    <div class="checkout-grid">


        <div class="card">

            <h2>
                Delivery Information
            </h2>


            {% if messages %}

                {% for message in messages %}

                    <p>
                        {{ message }}
                    </p>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="full_name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    required
                >


                <label>
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    required
                >


                <label>
                    Delivery Address
                </label>

                <textarea
                    name="address"
                    required
                ></textarea>


                <label>
                    City
                </label>

                <input
                    type="text"
                    name="city"
                    required
                >


                <button type="submit">
                    Place Order
                </button>

            </form>

        </div>


        <div class="card">

            <h2>
                Your Order
            </h2>


            {% for item in cart_items %}

                <div class="item">

                    <span>
                        {{ item.product.name }}
                        × {{ item.quantity }}
                    </span>

                    <span>
                        ₦{{ item.subtotal }}
                    </span>

                </div>

            {% endfor %}


            <div class="total">

                <span>
                    Total
                </span>

                <span>
                    ₦{{ total }}
                </span>

            </div>

        </div>


    </div>

</div>


</body>

</html>
