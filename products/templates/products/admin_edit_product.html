<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Product - MarketHub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .current-image {
            margin-bottom: 20px;
        }

        .current-image img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
        }

        .dark {
            background: #111827;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="card">

        <h1>
            Edit Product
        </h1>

        <p class="subtitle">
            Update product information
        </p>


        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}


            <label>
                Product Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ product.name }}"
                required
            >


            <label>
                Category
            </label>

            <input
                type="text"
                name="category"
                value="{{ product.category }}"
                required
            >


            <label>
                Price
            </label>

            <input
                type="number"
                name="price"
                value="{{ product.price }}"
                step="0.01"
                min="0"
                required
            >


            <label>
                Stock
            </label>

            <input
                type="number"
                name="stock"
                value="{{ product.stock }}"
                min="0"
                required
            >


            <label>
                Description
            </label>

            <textarea
                name="description"
            >{{ product.description }}</textarea>


            {% if product.image %}

            <div class="current-image">

                <label>
                    Current Image
                </label>

                <img
                    src="{{ product.image.url }}"
                    alt="{{ product.name }}"
                >

            </div>

            {% endif %}


            <label>
                Replace Image
            </label>

            <input
                type="file"
                name="image"
                accept="image/*"
            >


            <button
                type="submit"
                class="btn"
            >
                Save Changes
            </button>


            <a
                href="{% url 'admin_products' %}"
                class="btn dark"
            >
                Cancel
            </a>

        </form>

    </div>

</div>


</body>

</html>
